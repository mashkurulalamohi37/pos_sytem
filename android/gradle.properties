# JVM and memory settings for better build performance
# Added --add-opens to fix Java module access issues
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC --add-opens=java.base/java.lang.ref=ALL-UNNAMED
android.useAndroidX=true
android.enableJetifier=true

# Enable Gradle build optimizations
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon=true

# Performance: Enable build cache
org.gradle.caching=true

# Performance: Enable file system watching (faster incremental builds)
org.gradle.vfs.watch=true

# Performance: Enable configuration cache (faster builds)
# Note: Disabled due to compatibility issues with some Java versions
# Uncomment if you're using Gradle 8.5+ and Java 17+
# org.gradle.configuration-cache=true

# Performance: Enable build scan (optional, for build analysis)
# org.gradle.scan=true

# R8 options are deprecated and removed in AGP 7.0
# Use proguard-rules.pro file for controlling code shrinking instead

# Performance: Enable non-transitive R classes (smaller APK)
android.nonTransitiveRClass=true

# Performance: Enable namespaced resources
android.nonFinalResIds=false